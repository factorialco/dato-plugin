name: Deploy

# Publishes the built plugin to GitHub Pages, which is where DatoCMS loads it
# from. The plugin's entry point in DatoCMS points at the resulting URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — the last push to main is the one that should end up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Same lint/format/typecheck/test/build gate a pull request gets, so a broken
  # main is never published to the plugin editors actually load.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vite is configured with `base: './'`, so the build works unchanged
      # under the /dato-plugin/ path a project Pages site is served from.
      - run: pnpm build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v5
