name: CI

on:
  pull_request:
  # Called by the deploy workflow so main is gated by the same checks a pull
  # request gets, without duplicating the steps in two files.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ci

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      # Catches anything that only breaks in a production build.
      - run: pnpm build
